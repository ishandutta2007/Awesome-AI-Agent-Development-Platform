<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComponentTransfer in="blur" result="glow30">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow30"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200 M0 350H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M100 0V400 M200 0V400 M300 0V400 M400 0V400 M500 0V400 M600 0V400 M700 0V400 M800 0V400 M900 0V400 M1000 0V400 M1100 0V400" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Animated Dynamic Background Nodes & Connections -->
  <g opacity="0.35">
    <!-- Connecting Lines -->
    <path d="M 150 100 L 300 280 L 900 320 L 1050 120" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="8 6" fill="none">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="15s" repeatCount="indefinite"/>
    </path>
    <path d="M 200 320 L 450 80 L 800 100 L 1000 300" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="6 4" fill="none">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="20s" repeatCount="indefinite"/>
    </path>

    <!-- Floating Glowing Orbs -->
    <circle cx="150" cy="100" r="6" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="cy" values="100;115;100" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="280" r="8" fill="#6366f1" filter="url(#glow)">
      <animate attributeName="cx" values="300;315;300" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="320" r="7" fill="#06b6d4" filter="url(#glow)">
      <animate attributeName="cy" values="320;305;320" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="120" r="9" fill="#ec4899" filter="url(#glow)">
      <animate attributeName="cy" values="120;135;120" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ambient Backdrop Glow Behind Text -->
  <ellipse cx="600" cy="200" rx="420" ry="110" fill="url(#primaryGrad)" opacity="0.18" filter="url(#cardGlow)"/>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Icon / Tag -->
    <rect x="475" y="52" width="250" height="34" rx="17" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="1.5"/>
    <text x="600" y="74" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">
      🤖 AI AGENT ECOSYSTEM 🤖
    </text>

    <!-- Main Title -->
    <text x="600" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Awesome AI Agent Development Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
      Curated Multi-Agent Frameworks, Visual Builders &amp; Agent Infrastructure
    </text>

    <!-- Feature Pills in Banner Footer -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="200" height="42" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="100" y="26" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
          🕸️ State Graphs &amp; RAG
        </text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(500, 0)">
        <rect x="0" y="0" width="200" height="42" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
        <text x="100" y="26" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
          👥 Multi-Agent Crews
        </text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(760, 0)">
        <rect x="0" y="0" width="200" height="42" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
        <text x="100" y="26" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
          🎨 Visual Builders &amp; SaaS
        </text>
      </g>
    </g>

    <!-- Status Line -->
    <text x="600" y="355" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="0.5">
      UPDATED OCTOBER 2026 • COMMUNITY CURATED • OPEN SOURCE &amp; ENTERPRISE
    </text>
  </g>
</svg>
